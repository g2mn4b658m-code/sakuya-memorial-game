<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>咲くやメモリアル学園〜あのコに気をつけて〜</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#17131c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
#game{max-width:720px;min-height:100vh;margin:auto;background:linear-gradient(160deg,#fff5fb,#f2f5ff);color:#302838;position:relative;overflow:hidden}
.screen{min-height:100vh;padding:28px 20px;display:flex;flex-direction:column}
.hidden{display:none!important}
.title{justify-content:center;text-align:center;background:radial-gradient(circle at 50% 30%,#fff 0,#ffe8f3 45%,#dfe8ff 100%)}
.logo{font-size:clamp(30px,8vw,52px);font-weight:900;line-height:1.15;letter-spacing:.04em;text-shadow:2px 3px 0 #fff}
.sub{font-size:14px;letter-spacing:.2em;margin-top:14px}
button{border:0;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 5px 15px #0001}
.primary{background:#302838;color:#fff;margin-top:30px}.secondary{background:#fff;color:#302838;margin-top:12px}
.namebox{display:flex;gap:8px;margin-top:20px}.namebox input{flex:1;padding:14px;border:2px solid #ddd;border-radius:14px;font-size:16px}
.header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#6d6275;margin-bottom:15px}
.status{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 4px 15px #0000000d}
.char{height:44vh;min-height:270px;border-radius:24px;background:linear-gradient(145deg,#fff,#f8eef8);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;box-shadow:0 8px 30px #00000012;margin-bottom:16px}
.char .emoji{font-size:min(38vw,230px);filter:drop-shadow(0 8px 8px #0002);margin-bottom:18px}
.dialog{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 20px #0001}
.speaker{font-weight:900;margin-bottom:8px}.text{line-height:1.8;min-height:75px}
.choices{display:grid;gap:10px;margin-top:12px}.choice{background:#fff;border:2px solid #e7dce9;text-align:left;box-shadow:none}.choice:active{transform:scale(.98)}
.note{text-align:center;font-size:12px;color:#7d7083;margin:10px}
.end{justify-content:center;text-align:center}.heart{font-size:70px}.end h1{font-size:30px}.end p{line-height:1.8}
.small{font-size:12px;color:#766a79;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div id="game">

<section id="title" class="screen title">
  <div class="logo">咲くやメモリアル学園</div>
  <div class="sub">〜 あのコに気をつけて 〜</div>
  <p style="margin-top:28px;line-height:1.8">文化祭の後夜祭で<br><b>「ペアダンスを踊った2人は、必ず結ばれる」</b><br>――そんな噂があるらしい。</p>
  <button class="primary" onclick="start()">▶ はじめる</button>
  <button class="secondary" onclick="showAbout()">遊び方</button>
  <p class="small">文化祭用プロトタイプ / スマートフォン向け</p>
</section>

<section id="about" class="screen hidden">
  <h2>遊び方</h2>
  <p style="line-height:1.9">会話を読みながら選択肢を選んで進めよう。選択によって、4人のヒロインとの距離が変わります。</p>
  <ul style="line-height:2">
    <li>🌸 百合野 美咲 ― 憧れの先輩</li>
    <li>🌻 七咲 ひまわり ― 人懐っこい同期</li>
    <li>📚 瑠璃原 咲夜 ― クールな本好き</li>
    <li>🍰 桜咲 もも ― 甘いもの好きの後輩</li>
  </ul>
  <button class="primary" onclick="backTitle()">タイトルへ戻る</button>
</section>

<section id="play" class="screen hidden">
  <div class="header">
    <span id="chapter">PROLOGUE</span>
    <span class="status">🌸 <span id="misaki">0</span>　🌻 <span id="himawari">0</span>　📚 <span id="sakuya">0</span>　🍰 <span id="momo">0</span></span>
  </div>
  <div class="char"><div id="emoji" class="emoji">🏫</div></div>
  <div class="dialog">
    <div id="speaker" class="speaker">ナレーション</div>
    <div id="text" class="text"></div>
  </div>
  <div id="choices" class="choices"></div>
  <div id="next" class="note">タップして次へ</div>
</section>

<section id="end" class="screen end hidden">
  <div class="heart" id="endEmoji">💗</div>
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <button class="primary" onclick="location.reload()">もう一度遊ぶ</button>
</section>

</div>
<script>
let player="汝", scene=0, scores={misaki:0,himawari:0,sakuya:0,momo:0};
const scenes=[
 {sp:"ナレーション",em:"🏫",tx:"文化祭まで、あと一週間。\\nあなたは突然、文化祭実行委員に選ばれてしまった。"},
 {sp:"トモ",em:"😎",tx:"もしもーし？ 汝、聞こえてっか？ 俺だよ俺！トモだよ！\\nそういえば聴いたぞ〜！ お前、百合野先輩を『ペアダンス』に誘ったんだって？",ch:[
  ["「え、なんで知ってるの？」","misaki",2],["「……余計なこと言うな！」","himawari",1],["「そもそもペアダンスって何？」","sakuya",1]
 ]},
 {sp:"百合野 美咲",em:"🌸",tx:"あら、汝くん。実行委員、一緒に頑張りましょうね。\\n……ペアダンスのこと？ ふふ、どうしてそんなに気にするの？",ch:[
  ["「先輩と踊れたら嬉しいなって」","misaki",2],["「噂なんて信じてません」","sakuya",1],["「先輩は、誰と踊るんですか？」","misaki",1]
 ]},
 {sp:"七咲 ひまわり",em:"🌻",tx:"汝くん！ こっちこっち！\\n一緒に飾り付けしよ〜！ ……あ、そうだ。ペアダンスの相手、もう決めた？",ch:[
  ["「まだ。ひまわりは？」","himawari",2],["「秘密」","momo",1],["「文化祭が終わってから考える」","sakuya",1]
 ]},
 {sp:"瑠璃原 咲夜",em:"📚",tx:"……その噂、知ってる。\\nでも『必ず結ばれる』なんて、根拠がない。……ただ。",ch:[
  ["「ただ？」","sakuya",2],["「咲夜は信じてるの？」","sakuya",1],["「じゃあ一緒に検証してみる？」","himawari",1]
 ]},
 {sp:"桜咲 もも",em:"🍰",tx:"せんぱーい！ これ、差し入れです！\\nえへへ、文化祭準備って疲れますよね。甘いもの、食べます？",ch:[
  ["「ありがとう。一緒に食べよう」","momo",2],["「ももは優しいね」","momo",1],["「これ、何味？」","himawari",1]
 ]},
 {sp:"ナレーション",em:"🎪",tx:"夕方。校内放送が響く。\\n『実行委員は体育倉庫から、後夜祭用の飾りを運んでください』\\nあなたは誰かと一緒に倉庫へ向かうことになった。",ch:[
  ["美咲先輩を誘う","misaki",2],["ひまわりを誘う","himawari",2],["咲夜を誘う","sakuya",2],["ももを誘う","momo",2]
 ]},
 {sp:"ナレーション",em:"🔑",tx:"体育倉庫の前。\\n……鍵がない。\\n誰かが落としたらしい。すると、相手があなたを見つめた。",ch:[
  ["一緒に探す","himawari",1],["まず周りを観察する","sakuya",1],["先生に聞きに行く","misaki",1],["二人で手分けしよう","momo",1]
 ]},
 {sp:"トモ",em:"😎",tx:"よーし！ 文化祭前夜だ！\\nところで汝、お前……結局、誰と踊るんだ？",ch:[
  ["美咲先輩","misaki",3],["ひまわり","himawari",3],["咲夜","sakuya",3],["もも","momo",3]
 ]}
];

function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function start(){show("play");scene=0;render()}
function showAbout(){show("about")}
function backTitle(){show("title")}
function render(){
 let s=scenes[scene]; document.getElementById("chapter").textContent=scene<2?"PROLOGUE":"CULTURAL FESTIVAL";
 document.getElementById("speaker").textContent=s.sp; document.getElementById("emoji").textContent=s.em||"💬";
 document.getElementById("text").innerHTML=s.tx.replace(/\\n/g,"<br>");
 ["misaki","himawari","sakuya","momo"].forEach(k=>document.getElementById(k).textContent=scores[k]);
 let box=document.getElementById("choices");box.innerHTML="";
 if(s.ch){
  document.getElementById("next").classList.add("hidden");
  s.ch.forEach(c=>{let b=document.createElement("button");b.className="choice";b.textContent=c[0];b.onclick=()=>{scores[c[1]]+=c[2];scene++; if(scene>=scenes.length) finish(); else render()};box.appendChild(b)})
 }else{
  document.getElementById("next").classList.remove("hidden");document.getElementById("next").textContent="タップして次へ";
  document.getElementById("play").onclick=()=>{if(scene<scenes.length-1){scene++;render()}};
 }
}
function finish(){
 let key=Object.keys(scores).sort((a,b)=>scores[b]-scores[a])[0];
 const data={
  misaki:["🌸","百合野 美咲 END","「来年も……一緒に踊れたらいいですね」\\n先輩の笑顔を見て、あなたは思う。\\nこの噂、少しだけ信じてもいいのかもしれない。"],
  himawari:["🌻","七咲 ひまわり END","「ね、汝くん！ 来年も文化祭、一緒にやろうね！」\\nいつもの明るい笑顔。\\nその隣が、なんだか一番落ち着く気がした。"],
  sakuya:["📚","瑠璃原 咲夜 END","「……噂は、ただの噂」\\nそう言いながら、咲夜はそっと手を差し出す。\\n「でも、今日のことは……忘れないで」"],
  momo:["🍰","桜咲 もも END","「せんぱい！ ダンス、楽しかったです！」\\n甘い香りと一緒に、文化祭の一日が終わる。\\nあなたは小さく笑った。"]
 };
 document.getElementById("endEmoji").textContent=data[key][0];document.getElementById("endTitle").textContent=data[key][1];document.getElementById("endText").innerHTML=data[key][2].replace(/\\n/g,"<br>");
 show("end");
}
</script>
</body>
</html>
